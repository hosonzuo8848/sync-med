name: 内容工厂哨兵

# 每 2 小时查百家论道产帖健康;停滞(近3h新增<2篇)自动写 Issue 报警。
# 铁律:自动产线关键缺口必须上升成哨兵/Issue,不能只躺 log 没人看。
on:
  schedule:
    - cron: '25 */2 * * *'
  workflow_dispatch:

# 2026-08-15 补 permissions：哨兵一直在正确检测到「内容工厂产帖停滞」，
#   但写 Issue 时被 GITHUB_TOKEN 默认权限拒掉：
#   `HttpError: Resource not accessible by integration`（run 33114029499 实证）。
#   报错让整个 job 失败 → 哨兵自己也变成红灯 → 既喊不出问题，又多了一个假故障。
#   而且它**只在有话要说的那一轮失败** —— 产帖正常时不写 Issue，所以是绿的；
#   一旦停滞要报警就炸。查 run 历史会看到绿红交替，很容易被当成"偶发抖动"。
#   对照 fleet-watch.yml（能正常写 Issue）：它显式声明了 issues: write。
#
#   ⚠️ 这段与 PR #309 内容相同。#309 开于 2026-08-14、至今 MERGEABLE 未合，
#      期间哨兵一直在失败。若 #309 先合，这里会冲突，以 #309 为准即可。
permissions:
  contents: read
  issues: write

concurrency:
  group: roundtable-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - id: check
        run: python tools/roundtable/watch.py
        env:
          CF_D1_TOKEN: ${{ secrets.D1_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}   # 2026-09-15: opsec commit 5eb1f75 moved the account id to env but never passed it here -> D1 URL 404, 0 posts since 08-30
      - name: 停滞则写 Issue
        if: steps.check.outputs.stalled == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            // 2026-08-31 upsert-guard: 有开着的同类告警就追评论,不再每轮新建一个 Issue。
            // 侦察实测:持续停滞时旧写法最多每天 12 个新 Issue 刷屏。
            const _open = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'alert', per_page: 20 });
            const _hit = _open.data.find(i => (i.labels||[]).some(l => (l.name||l) === 'content-factory'));
            if (_hit) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: _hit.number,
                body: `${new Date().toISOString()} 仍停滞(近3h新增 ${{ steps.check.outputs.recent }} 篇)` });
            } else
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `⚠️ 百家论道内容工厂产帖停滞(近3h新增 ${{ steps.check.outputs.recent }} 篇)`,
              body: `内容工厂产帖疑似停滞。累计 ${{ steps.check.outputs.total }} 帖。\n\n排查:①本地循环 loop_8h.log 是否还在跑 ②Actions cron roundtable.yml 是否触发失败 ③/api/gateway/chat 免费池是否可达 ④D1_API_TOKEN 是否过期。`,
              labels: ['content-factory', 'alert']
            });
