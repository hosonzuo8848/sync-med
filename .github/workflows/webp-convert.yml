name: webp-convert
# Cloud PDF/JPG -> page_NNNN.webp for 123pan (MVP). Manual dispatch only.
# Book lists, ledgers and the shared 123 token live in the PRIVATE repo
# (FORGE_REPO); this public repo holds code only. Logs print counters only,
# no titles / paths / ids. No artifacts are uploaded.
#
# Order of a run:
#   prep     selftest (stubbed) -> shard matrix -> shared token (the ONLY place
#            that may log in to 123; reuses the stored token while it is valid)
#   convert  one job per shard; never logs in; stops starting new books after
#            --deadline-min and writes its ledger/stats to the private repo
#   summary  aggregates ledgers into the private issue (progress title)

on:
  workflow_dispatch:
    inputs:
      books:
        description: 'book list in the private repo (data/webp/x.csv) or comma-separated book_ids'
        required: true
      shards:
        description: 'matrix shards (1-20)'
        default: '1'
      concurrency:
        description: 'books in parallel per shard'
        default: '2'
      dry_run:
        description: '1 = read-only plan (no download, no mkdir, no upload)'
        default: '1'
      target_account:
        description: '123 account that receives the webp (main = the one the reader serves)'
        type: choice
        options: [main, guji]
        default: main
      limit_pages:
        description: 'smoke test: only the first N pages of each book (0 = all)'
        default: '0'

permissions:
  contents: read
  issues: write   # summary imports gh_issue; it writes to the private repo with FORGE_TOKEN

concurrency:
  group: webp-convert-${{ inputs.target_account }}-${{ inputs.books }}
  cancel-in-progress: false

env:
  FORGE_REPO: hosonzuo/sueai-forge
  # Totals per 123 ACCOUNT across all shards (each shard uses total / shards).
  # file/list is hard-limited to 3/s per account and shared with the site,
  # pan-register and the inventory job; upload limits are not measured yet.
  WEBP_LIST_QPS: '1'
  WEBP_DL_QPS: '2'
  WEBP_UP_QPS: '4'
  WEBP_MISC_QPS: '1'

jobs:
  prep:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      shards: ${{ steps.m.outputs.shards }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: hosonzuo/sueai-forge
          token: ${{ secrets.FORGE_TOKEN }}
          path: forge
          sparse-checkout: data/webp
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet requests cryptography pymupdf pillow
      - name: selftest (stubbed 123 and download, no network)
        run: python scripts/webp_convert/run.py --selftest
      - name: shard matrix
        id: m
        env:
          SHARDS: ${{ inputs.shards }}
        run: |
          python -c "import json,os; n=max(1,min(20,int(os.environ['SHARDS']))); print('shards='+json.dumps(list(range(n))))" >> "$GITHUB_OUTPUT"
      - name: shared 123 token (only step allowed to log in)
        env:
          BOOKS: ${{ inputs.books }}
          TARGET: ${{ inputs.target_account }}
          FORGE_TOKEN: ${{ secrets.FORGE_TOKEN }}
          PAN_CID_MAIN: ${{ secrets.PAN_CID }}
          PAN_SEC_MAIN: ${{ secrets.PAN_SEC }}
          PAN_CID_GUJI: ${{ secrets.PAN_CID2 }}
          PAN_SEC_GUJI: ${{ secrets.PAN_SEC2 }}
        run: python scripts/webp_convert/run.py token --forge forge --books "$BOOKS" --target "$TARGET"

  convert:
    needs: prep
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.prep.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4          # after prep, so it sees the fresh token file
        with:
          repository: hosonzuo/sueai-forge
          token: ${{ secrets.FORGE_TOKEN }}
          path: forge
          sparse-checkout: data/webp
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet requests cryptography pymupdf pillow
      - name: convert + upload one shard
        env:
          BOOKS: ${{ inputs.books }}
          TARGET: ${{ inputs.target_account }}
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ strategy.job-total }}
          CONC: ${{ inputs.concurrency }}
          DRY: ${{ inputs.dry_run }}
          LIMIT: ${{ inputs.limit_pages }}
          FORGE_TOKEN: ${{ secrets.FORGE_TOKEN }}
          PAN_CID_MAIN: ${{ secrets.PAN_CID }}
          PAN_SEC_MAIN: ${{ secrets.PAN_SEC }}
          PAN_CID_GUJI: ${{ secrets.PAN_CID2 }}
          PAN_SEC_GUJI: ${{ secrets.PAN_SEC2 }}
          # optional: purchased direct-link space (zero API calls). Unset -> API download.
          PAN_UID_GUJI: ${{ secrets.PAN_UID_GUJI }}
          PAN_DIRECT_KEY_GUJI: ${{ secrets.PAN_DIRECT_KEY_GUJI }}
          PAN_UID_MAIN: ${{ secrets.PAN_UID_MAIN }}
          PAN_DIRECT_KEY_MAIN: ${{ secrets.PAN_DIRECT_KEY_MAIN }}
        run: >
          python scripts/webp_convert/run.py run --forge forge --books "$BOOKS"
          --target "$TARGET" --shard "$SHARD" --shards "$SHARDS" --concurrency "$CONC"
          --dry-run "$DRY" --limit-pages "$LIMIT" --deadline-min 320

  summary:
    needs: [prep, convert]
    if: always() && needs.prep.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: hosonzuo/sueai-forge
          token: ${{ secrets.FORGE_TOKEN }}
          path: forge
          sparse-checkout: data/webp
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet requests
      - name: progress issue in the private repo
        env:
          BOOKS: ${{ inputs.books }}
          FORGE_TOKEN: ${{ secrets.FORGE_TOKEN }}
        run: python scripts/webp_convert/run.py summary --forge forge --books "$BOOKS"
