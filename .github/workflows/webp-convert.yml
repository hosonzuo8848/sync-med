name: webp-convert
# Cloud PDF/JPG -> page_NNNN.webp for 123pan (MVP). Manual dispatch only.
# Book lists, ledgers and the shared 123 token live in the PRIVATE repo
# (FORGE_REPO); this public repo holds code only. Logs print counters only; the
# books input is read from the event payload (--books @event), so list names
# and ids never show up in step headers. No artifacts are uploaded.
#
# Order of a run:
#   prep     selftest (stubbed) -> in-flight cap + shard matrix -> shared token
#            (logs in only when the stored token is missing / expiring / revoked;
#            stops when data/webp/accounts.json names another uid for an account)
#   convert  one job per shard, at most 5 at once in this repo. On 401 a shard
#            re-reads the token file; only shard 0 may log in again, once.
#            Stops starting books at 320 min, stops in-flight books at 335 min,
#            writes its ledger/stats to the private repo. Exit 1 on token loss or
#            when the breaker trips (same 123 error 5x in a row, e.g. code=1 ban).
#   summary  aggregates ledgers into the private issue (progress title + target)

on:
  workflow_dispatch:
    inputs:
      books:
        description: 'book list in the private repo (data/webp/x.csv) or comma-separated book_ids'
        required: true
      shards:
        description: 'matrix shards; shards x concurrency must stay <= WEBP_MAX_INFLIGHT'
        default: '1'
      concurrency:
        description: 'books in parallel per shard (each uploads one page at a time)'
        default: '2'
      dry_run:
        description: '1 = read-only plan (no download, no mkdir, no upload)'
        default: '1'
      target_account:
        description: '123 account that receives the webp (main = the one the reader serves)'
        type: choice
        options: [main, guji]
        default: main
      limit_pages:
        description: 'smoke test: only the first N pages of each book (0 = all)'
        default: '0'

permissions:
  contents: read
  issues: write   # summary imports gh_issue; it writes to the private repo with FORGE_TOKEN

# One run per 123 target account at a time in this repo: two runs side by side
# would double the uploads in flight on that account.
concurrency:
  group: webp-convert-${{ inputs.target_account }}
  cancel-in-progress: false

env:
  FORGE_REPO: hosonzuo/sueai-forge
  # Totals per 123 ACCOUNT across all shards (each shard uses total / shards).
  # file/list is hard-limited to 3/s per account and shared with the site,
  # pan-register and the inventory job; measured write ceiling ~9 pages/s/account.
  WEBP_LIST_QPS: '1'
  WEBP_DL_QPS: '2'
  WEBP_UP_QPS: '4'
  WEBP_MISC_QPS: '1'
  # 123 red line: <= 20 uploads in flight per account, all writers and all repos
  # together (2026-07-02: ~60 in flight -> account-wide write ban for 2.5 h).
  # One run here may use 10; with more repos on one account split the 20.
  WEBP_MAX_INFLIGHT: '10'
  # Direct-link downloads draw on the paid 123 traffic package the site serves
  # images from. Off until approved; then '1' plus PAN_UID_* / PAN_DIRECT_KEY_*.
  WEBP_DIRECT: '0'

jobs:
  prep:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      shards: ${{ steps.m.outputs.shards }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.FORGE_REPO }}
          token: ${{ secrets.FORGE_TOKEN || secrets.FANGJI_FORGE_TOKEN }}
          path: forge
          sparse-checkout: data/webp
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet requests cryptography pymupdf pillow
      - name: selftest (stubbed 123 and download, no network)
        run: python scripts/webp_convert/run.py --selftest
      - name: in-flight cap + shard matrix
        id: m
        env:
          SHARDS: ${{ inputs.shards }}
          CONC: ${{ inputs.concurrency }}
        run: python scripts/webp_convert/run.py matrix --shards "$SHARDS" --concurrency "$CONC" >> "$GITHUB_OUTPUT"
      - name: shared 123 token
        env:
          TARGET: ${{ inputs.target_account }}
          FORGE_TOKEN: ${{ secrets.FORGE_TOKEN || secrets.FANGJI_FORGE_TOKEN }}
          PAN_CID_MAIN: ${{ secrets.PAN_CID }}
          PAN_SEC_MAIN: ${{ secrets.PAN_SEC }}
          PAN_CID_GUJI: ${{ secrets.PAN_CID2 }}
          PAN_SEC_GUJI: ${{ secrets.PAN_SEC2 }}
        run: python scripts/webp_convert/run.py token --forge forge --books @event --target "$TARGET"

  convert:
    needs: prep
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 5          # this repo also runs sync / pan-register / sentinels
      matrix:
        shard: ${{ fromJSON(needs.prep.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4          # after prep, so it sees the fresh token file
        with:
          repository: ${{ env.FORGE_REPO }}
          token: ${{ secrets.FORGE_TOKEN || secrets.FANGJI_FORGE_TOKEN }}
          path: forge
          sparse-checkout: data/webp
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet requests cryptography pymupdf pillow
      - name: convert + upload one shard
        env:
          TARGET: ${{ inputs.target_account }}
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ strategy.job-total }}
          CONC: ${{ inputs.concurrency }}
          DRY: ${{ inputs.dry_run }}
          LIMIT: ${{ inputs.limit_pages }}
          FORGE_TOKEN: ${{ secrets.FORGE_TOKEN || secrets.FANGJI_FORGE_TOKEN }}
          PAN_CID_MAIN: ${{ secrets.PAN_CID }}
          PAN_SEC_MAIN: ${{ secrets.PAN_SEC }}
          PAN_CID_GUJI: ${{ secrets.PAN_CID2 }}
          PAN_SEC_GUJI: ${{ secrets.PAN_SEC2 }}
        run: >
          python scripts/webp_convert/run.py run --forge forge --books @event
          --target "$TARGET" --shard "$SHARD" --shards "$SHARDS" --concurrency "$CONC"
          --dry-run "$DRY" --limit-pages "$LIMIT" --deadline-min 320 --stop-min 335

  summary:
    needs: [prep, convert]
    if: always() && needs.prep.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.FORGE_REPO }}
          token: ${{ secrets.FORGE_TOKEN || secrets.FANGJI_FORGE_TOKEN }}
          path: forge
          sparse-checkout: data/webp
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet requests
      - name: progress issue in the private repo
        env:
          TARGET: ${{ inputs.target_account }}
          FORGE_TOKEN: ${{ secrets.FORGE_TOKEN || secrets.FANGJI_FORGE_TOKEN }}
        run: python scripts/webp_convert/run.py summary --forge forge --books @event --target "$TARGET"
