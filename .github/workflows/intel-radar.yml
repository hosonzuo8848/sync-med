# ============================================================
#
# ============================================================

# 注:挖掘引擎 / 吸收官 / 分类表已于 2026-09-02 迁到私有仓
# hosonzuo/sueai-forge 的 radar.yml 运行 —— 核心引擎与平台实情不留公开仓。
# 本 workflow 只保留老雷达(daily_report_v3)与不含平台实情的两张报表。
name: Intel Radar Daily Report v3

on:
  schedule:
    - cron: '30 0 * * *'   # 00:30 UTC = 08:30 Beijing. CTO 2026-07-26: must run BEFORE council (01:00 UTC), otherwise council eats yesterday's intel.
  workflow_dispatch:
    inputs:
      dry_run:
        description: '只抓取不分析 (测试抓取量)'
        required: false
        default: 'false'
      no_github:
        description: '跳过 GitHub 抓取 (省速率限额)'
        required: false
        default: 'false'

concurrency:
  group: intel-radar
  cancel-in-progress: false   # 不取消已在运行的，排队等待

jobs:
  daily-report:
    name: Generate Daily Intel Report v3
    runs-on: ubuntu-latest   # 标准 runner, public repo 完全免费
    timeout-minutes: 40      # room for crawl4ai setup plus at most 3 browser pages

    permissions:
      # write is ONLY for reports/arsenal/* (the council's input file + the
      # ledger + the star snapshots). The commit step below hard-fails if
      # anything else is staged, same rail as council.yml.
      # (crawl_core 的指纹文件此前也在白名单里;挖掘引擎 2026-09-02 迁到私有仓后,
      #  本仓不再调用 crawl_core,那条白名单随之撤销 —— 白名单只该有真在用的。)
      contents: write
      issues: write    # gh issue create 发情报日报到手机需要(连挂6天缺这个)

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # lxml is the only non-stdlib dependency here. daily_report_v3.py is
      # deliberately stdlib-only, but gh_trending_real needs a real parser:
      # a hand-rolled regex over the trending board returned 0 rows, lxml
      # returns 51. gh_trending_real degrades gracefully if this is ever
      # missing (ImportError -> skip that one source, radar still runs).
      #
      # trafilatura: full-text extractor for the synthesis step (strips nav/
      # footer boilerplate off article pages before they hit the LLM). Also an
      # optional import -- fetch_article_text returns "" if it's absent, so the
      # radar runs identically without it, just without the full-text excerpts.
      # crawl4ai is the browser tier already used by p12/p15. eagle_fetch only
      # calls it after plain HTTP comes back empty or blocked, and only up to
      # EAGLE_BROWSER_MAX pages. It does not bypass a challenge page.
      - run: |
          pip install --quiet lxml 'trafilatura>=1.8,<3' crawl4ai
          crawl4ai-setup

      - name: Run Intel Radar v3 (cloud mode)
        env:
          GH_TOKEN: ${{ github.token }}   # gh 发issue认证·连挂6天缺这个
          ZHIPU_API_KEY:  ${{ secrets.ZHIPU_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO:   ${{ secrets.MAIL_TO }}
          CF_ACCOUNT_ID:  ${{ secrets.CF_ACCOUNT_ID }}
          D1_API_TOKEN:   ${{ secrets.D1_API_TOKEN }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          # --- arsenal radar: distillation model pools, FREE ONLY ---
          # Same bench as scripts/council/llm_roster.py, which this radar
          # imports READ-ONLY. A vendor with no secret is simply absent from the
          # bench: no error, and above all no fallback to anything metered.
          # Cloudflare Workers AI / GitHub Models / xunfei MaaS chat are NOT
          # here and must not be added -- see llm_roster.py's docstring for why
          # the failure mode ("quota out = service stops") is the whole test.
          AGNES_API_KEY:      ${{ secrets.AGNES_API_KEY }}
          AGNES_API_BASE:     ${{ secrets.AGNES_API_BASE }}
          AGNES_TEXT_MODEL:   ${{ secrets.AGNES_TEXT_MODEL }}
          GEMINI_API_KEY:     ${{ secrets.GEMINI_API_KEY }}
          SENSENOVA_API_KEY:  ${{ secrets.SENSENOVA_API_KEY }}
          LONGCAT_API_KEY:    ${{ secrets.LONGCAT_API_KEY }}
          CEREBRAS_API_KEY:   ${{ secrets.CEREBRAS_API_KEY }}
          MODELSCOPE_API_KEY: ${{ secrets.MODELSCOPE_API_KEY }}
          SILICONFLOW_KEY:    ${{ secrets.SILICONFLOW_KEY }}
          CF_NEURON_BUDGET: '0'    # belt to llm_roster's braces
          EAGLE_BROWSER: '1'
          EAGLE_BROWSER_MAX: '3'
          ARSENAL_LLM_CALLS: '12'  # distillation cap, separate from the council's
        run: |
          EXTRA_ARGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --dry-run"
          fi
          if [ "${{ github.event.inputs.no_github }}" = "true" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --no-github"
          fi
          python scripts/intel_radar/daily_report_v3.py --cloud $EXTRA_ARGS



      - name: Render arsenal boards (md + xlsx)
        if: always()
        env:
          # 分类表要给头部项目写中文详解,走内部免费池网关。
          # 没有这个 key,网关直接回 UNAUTHORIZED,详解会**整批静默失败**
          # (2026-09-02 实测:漏了它,40 个详解全挂,日志只写"跳过",
          #  不 curl 一次根本看不出是缺 key 还是模型不通)。
          GW_KEY: ${{ secrets.GW_KEY }}
          PLATFORM_CONTEXT: ${{ secrets.PLATFORM_CONTEXT }}
          OURS_STACK: ${{ secrets.OURS_STACK }}
          # arsenal_category 现在会给头部项目抓 README 再写详解(以前只喂 300 字描述,
          # 模型再强也变不出它没见过的信息)。抓 README 走 GitHub API,
          # **没有 token 就落进每 IP 60 次/小时的匿名桶**,和同一 runner 上别的作业共用,
          # 24 个 README 很容易被限流成整批空详解。
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/intel_radar/arsenal_md.py || true
          python -m pip install --quiet openpyxl >/dev/null 2>&1 || true
          python scripts/intel_radar/arsenal_xlsx.py || true

      # The council reads reports/arsenal/candidates.json out of the repo, and
      # the 30-day star delta is computed by diffing star_history.json against
      # itself across runs. Both only work if the files SURVIVE the run -- an
      # artifact-only radar would hand the council nothing and could never
      # measure growth. Same guarded-commit shape as council.yml.
      # 除 reports/arsenal 外,**只多一个具名文件**:scripts/crawl_core/fingerprints.json。
      # 它是 trending 自适应解析的元素指纹(上一次成功时列表长什么样)。
      # runner 每轮全新,这个文件不 commit 回去就不跨 run 存活,
      # 那"GitHub 改版也不失效"这条在 Actions 上等于零 —— 自适应层会变成纯装饰。
      # 放宽的是**一个写死的路径**,不是通配符:闸本身的严格性不变。
      - name: commit arsenal ledger (reports/arsenal + trending 指纹)
        if: always()
        run: |
          set -e
          git config user.name  "intel-radar[bot]"
          git config user.email "intel-radar@users.noreply.github.com"
          git add -- reports/arsenal || true
          STAGED=$(git diff --cached --name-only)
          if [ -z "$STAGED" ]; then
            echo "nothing to commit"
            exit 0
          fi
          # 中文文件名会被 git 输出成带引号的八进制转义:
          #   (a Chinese filename shows up octal-escaped by git)
          # 开头多了个引号,`grep -v '^reports/arsenal/'` 匹配不上,于是把**本来就在
          # arsenal 目录里**的军火榜误判成越界、整轮 fail(2026-09-02 实证)。
          # 修法:比对前先剥掉首尾引号(git -c core.quotepath=false 也能解,但那要改
          # git 配置、影响面更大;这里只放宽比对,闸本身的严格性不变)。
          OUTSIDE=$(echo "$STAGED" | sed 's/^"//; s/"$//' \
                    | grep -v '^reports/arsenal/' \
                    || true)
          if [ -n "$OUTSIDE" ]; then
            echo "::error::intel-radar tried to commit files outside reports/arsenal/:"
            echo "$OUTSIDE"
            exit 1
          fi
          echo "$STAGED"
          git commit -m "arsenal candidates $(date -u +%F) [skip ci]"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: intel-radar-report-${{ github.run_id }}
          path: |
            scripts/intel_radar/reports/
            reports/arsenal/
          retention-days: 30
