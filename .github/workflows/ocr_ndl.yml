name: ocr-ndl

on:
  workflow_dispatch:
    inputs:
      total:
        description: shard count (concurrency)
        default: "40"
      pilot:
        description: pilot page cap per shard (empty = full run)
        default: ""
  # 2026-09-26: schedule paused to yield the 139 pan account to webp-convert (PAN_CLIENT_ID is the 139 account;
  #   each shard logs in separately and revokes the converter's token). Restore after the conversion batch.
  # schedule:
  #   - cron: '30 */6 * * *'   # 错开ocr.yml(整点),同一套org并发池温和轮换

concurrency:
  group: ocr-ndl-run
  cancel-in-progress: false

jobs:
  prep:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.g.outputs.shards }}
      pan_token: ${{ steps.panlogin.outputs.token }}
    steps:
      - id: g
        run: python -c "import json,os;print('shards='+json.dumps(list(range(int(os.environ['T'])))))" >> "$GITHUB_OUTPUT"
        env:
          T: ${{ github.event.inputs.total || '40' }}
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --quiet requests
      # 2026-09-26: log in ONCE here, hand the token to every run-job shard via a masked
      # job output. Fixes 40 shards (max-parallel 8) each calling access_token and
      # revoking each other's token -- 123 keeps only the newest login per account. Same
      # masking convention as webp-convert.yml / scripts/webp_convert/run.py's mask().
      - name: pan login once
        id: panlogin
        run: |
          set -euo pipefail
          TOKEN=$(python pan_login.py)
          if [ -z "$TOKEN" ]; then echo "empty token" >&2; exit 1; fi
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"
        env:
          PAN_CID: ${{ secrets.PAN_CLIENT_ID }}
          PAN_SEC: ${{ secrets.PAN_CLIENT_SECRET }}

  run:
    needs: prep
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 8   # 2026-07-16血泪教训沿用:org整体Free-plan并发上限~20,和ocr.yml共享,别抢爆
      matrix:
        shard: ${{ fromJSON(needs.prep.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: git clone --depth 1 https://github.com/ndl-lab/ndlocr-lite
      - run: pip install --quiet -r ndlocr-lite/requirements.txt boto3 requests
      # job outputs are NOT masked across jobs (each job is a fresh runner) -- re-apply the
      # mask here before this job's own logs can echo the token back in plain text.
      - name: mask prefetched pan token
        run: echo "::add-mask::$PAN_CLIENT_TOKEN_PREFETCHED"
        env:
          PAN_CLIENT_TOKEN_PREFETCHED: ${{ needs.prep.outputs.pan_token }}
      # deadletter.json rides in the same cache as the ledger: it is the record of
      # pages that failed, without which every run re-fetches the same dead pages
      # forever (2026-07-28: err was running at twice done, 92% of it the same
      # "page not on 123" pages every 6 hours). Older cache entries hold only
      # ledger.json; the script treats a missing dead-letter file as empty.
      - name: restore ledger cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ledger.json
            deadletter.json
          key: ocrndl-ledger-s${{ matrix.shard }}-${{ github.run_id }}
          restore-keys: |
            ocrndl-ledger-s${{ matrix.shard }}-
      - run: python ocr_ndl.py
        env:
          S_EP: ${{ secrets.S_EP }}
          S_AK: ${{ secrets.S_AK }}
          S_SK: ${{ secrets.S_SK }}
          S_BUCKET: ${{ secrets.S_BUCKET }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          D1_API_TOKEN: ${{ secrets.D1_API_TOKEN }}
          PAN_CLIENT_ID: ${{ secrets.PAN_CLIENT_ID }}
          PAN_CLIENT_SECRET: ${{ secrets.PAN_CLIENT_SECRET }}
          # 2026-09-26: logged in once by prep -- see pan_login.py. pan_token() in
          # ocr_ndl.py uses this instead of calling access_token itself.
          PAN_CLIENT_TOKEN_PREFETCHED: ${{ needs.prep.outputs.pan_token }}
          SHARD: ${{ matrix.shard }}
          TOTAL: ${{ github.event.inputs.total || '40' }}
          PILOT: ${{ github.event.inputs.pilot }}
      - name: save ledger cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ledger.json
            deadletter.json
          key: ocrndl-ledger-s${{ matrix.shard }}-${{ github.run_id }}
