name: fangji-ai-refine

# Formula library AI refinement.
#
# Why: the regex miner grounds every field in the source text, but grounding is not
# semantics -- "with four sheng of water" IS in the source yet is a decoction step,
# not a herb. Roughly half the composition fields hold procedure text, not herbs.
#
# Model race, redone 2026-07-26 12:2x on a FIXED shared sample (the first race was
# invalid: each supplier drew a different batch because the worker filters on
# ai_ok IS NULL, so whoever ran first consumed the rows -- seven suppliers graded on
# seven different exam papers. That bad comparison is what got NVIDIA cut at "7%").
#
# Fair numbers, same 20 rows for everyone, counting hallucinations rather than
# "pass" (a correct "this is not a formula" verdict is a success, not a failure):
#   nvidia   20/20 valid, 0 hallucinations   <- best
#   xf_qwen  19/20 valid, 1 hallucination    <- fastest, 18429 rows done in 2h
#   zhipu    10/20 valid, 10 hallucinations
#   agnes / modelscope: fail inside Actions (14 and 39 rows in two hours)
#   siliconflow / cerebras: malformed output
# Round three (2026-07-26 13:0x) went wider still, on the founder's instruction:
#   "wire up every model on every platform -- name them NVIDIA-QWEN3, NVIDIA-QWEN3.5,
#    not just one NVIDIA"
# Measured, not assumed: 771 models listed across the free platforms -> 75 answer a
# 1-token probe -> 65 raced on the SAME 8 rows -> 27 with zero hallucination -> the 8
# below scored >=4/8. Each is its own lane, so throughput scales with models, not with
# platforms (it used to be one hard-coded model per platform: 2 lanes total).
#
# Counter-intuitive findings worth keeping: bigger is not better (Qwen3-235B 1/8 vs
# gemma-4-31b 7/8), and every llama variant on nvidia hallucinated -- it reads the
# classical Chinese source as "encoding issues" and then invents a plausible formula.
# Nationality is not the predictor either: Google's gemma-4-31b topped the board.
#
# Cost: zero. All three are free tiers reached through the platform's own gateway,
# so no credentials live in this public repo.

on:
  workflow_dispatch:
    inputs:
      limit:
        description: rows per shard
        default: '25000'
      workers:
        description: concurrency per shard
        default: '5'
  # 2026-09-11 P0.5 of the formulas v2 switch: cron paused. It rewrites ai_ok/ai_herbs on the OLD table only,
  # never reaches sue_formulas_pub, the last three runs were cancelled after 5-7 h, and every write drifts the v1
  # snapshot. Re-enable by restoring the two lines below once refine targets v2 (blueprint 2026-09-10 s3.5).
  # schedule:
  #   - cron: '20 */6 * * *'

concurrency:
  group: fangji-ai-refine
  cancel-in-progress: false

jobs:
  refine:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        include:
          - supplier: deepseek-v4-flash
            shard: 0
          - supplier: nvidia-gemma-4-31b
            shard: 1
          - supplier: nvidia-mistral-nemotron
            shard: 2
          - supplier: nvidia-gemma-3n-e4b
            shard: 3
          - supplier: agnes-2.0-flash
            shard: 4
          - supplier: zhipu-glm-4-flash
            shard: 5
          - supplier: sensenova-flash
            shard: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: refine shard
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          D1_API_TOKEN: ${{ secrets.D1_API_TOKEN }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          NVIDIA_KEYS: ${{ secrets.NVIDIA_KEYS }}
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          ZHIPU_KEY: ${{ secrets.ZHIPU_KEY }}
          CEREBRAS_KEYS: ${{ secrets.CEREBRAS_KEYS }}
          SENSENOVA_KEYS: ${{ secrets.SENSENOVA_KEYS }}
        run: |
          python scripts/fangji_ai_refine.py \
            --supplier ${{ matrix.supplier }} \
            --shard ${{ matrix.shard }} --total 7 \
            --limit ${{ github.event.inputs.limit || 25000 }} \
            --workers ${{ github.event.inputs.workers || 5 }}
