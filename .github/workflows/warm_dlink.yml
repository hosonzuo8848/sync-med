name: warm-dlink

# 123 direct-link KV pre-warmer (2026-07-25). Populates pan:fid / pan:dlink KV cache entries
# that functions/api/_lib/pan123.js's fetchViaDirectLink() reads at request time, so real
# traffic never pays the first-hit 123 API cost. See warm_dlink.py header for the full
# design writeup (two-layer skip via ledger.json + live KV GET, rate-limit discipline against
# 123's shared file/list 3 QPS / direct-link/url 5 QPS ceilings, matrix sharding, soft time
# budget). Supersedes warm_thumbs.yml (retired same day -- see that file's header).
#
# Never writes R2, never downloads image bytes, never touches D1 (read-only query). Only
# writes two small strings per book into Cloudflare KV.

on:
  workflow_dispatch:
    inputs:
      total:
        description: "shard count (matrix parallelism, keep <=3 -- 123 quota is account-wide shared with the download line)"
        default: "3"
      pilot:
        description: "cap on items attempted per shard this run (empty = unlimited, gated only by the 105min soft deadline)"
        default: ""
  # Every 3 hours; each tick only progresses what the ledger/KV says isn't done yet (idempotent, additive-only)
  schedule:
    - cron: "35 */3 * * *"

# One round at a time -- overlapping rounds would double the request rate against the
# shared 123 quota. A new tick queues behind an in-progress one, never kills it mid-flight
# (killing mid-flight would skip the "save ledger cache" step and lose that round's progress).
concurrency:
  group: warm-dlink
  cancel-in-progress: false

jobs:
  prep:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.gen.outputs.shards }}
      pan_token_cipher: ${{ steps.panlogin.outputs.cipher }}
    steps:
      - id: gen
        run: |
          python -c "
          import json, os
          T = int(os.environ['T'])
          print('shards=' + json.dumps(list(range(T))))
          " >> "$GITHUB_OUTPUT"
        env:
          T: ${{ github.event.inputs.total || '3' }}
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --quiet requests
      # 2026-09-26 rework: log in ONCE here, hand the token to every run-job shard. Fixes 3
      # shards each calling access_token near the same instant and revoking each other's
      # token -- warm_dlink.py's KV pan:tok cache already dedupes most of this, but not the
      # first request of a run, before any shard has written it.
      #
      # The token does NOT go into the job output in plaintext -- GitHub Actions silently
      # drops a job output whose value has been through ::add-mask:: ("Skip output '<name>'
      # since it may contain secret"; confirmed on a throwaway branch, run 36201413266). The
      # first version of this fix put the masked token straight into GITHUB_OUTPUT and never
      # actually worked -- every shard read it back empty and silently logged in itself.
      # Fix: encrypt with the same PAN_CLIENT_SECRET the run job already has (pan_crypt.py,
      # openssl aes-256-cbc), put only the CIPHERTEXT in the output. The run job decrypts
      # with its own copy of that secret and hands the plaintext to the script via
      # $GITHUB_ENV only (masked first), never through an output or an echo.
      - name: pan login once
        id: panlogin
        run: |
          set -euo pipefail
          TOKEN=$(python pan_login.py)
          if [ -z "$TOKEN" ]; then echo "empty token" >&2; exit 1; fi
          echo "::add-mask::$TOKEN"
          CIPHER=$(printf '%s' "$TOKEN" | PAN_PASS="$PAN_SEC" python pan_crypt.py encrypt)
          echo "cipher=$CIPHER" >> "$GITHUB_OUTPUT"
        env:
          PAN_CID: ${{ secrets.PAN_CLIENT_ID }}
          PAN_SEC: ${{ secrets.PAN_CLIENT_SECRET }}

  run:
    needs: prep
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        shard: ${{ fromJSON(needs.prep.outputs.shards) }}
    timeout-minutes: 115   # script self-wraps at 105min internally; this is just a hard backstop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --quiet requests
      # Decrypt what prep encrypted (see prep's "pan login once" comment). Empty/
      # undecryptable cipher -> do NOT set the env var -> warm_dlink.py's get_token() sees
      # it absent and falls back to logging in itself (logged, not silent).
      - name: decrypt prefetched pan token
        run: |
          set -euo pipefail
          if [ -z "$PAN_TOKEN_CIPHER" ]; then
            echo "WARN: no prefetched token cipher -- this shard will log in itself (fallback)" >&2
          else
            TOK=$(printf '%s' "$PAN_TOKEN_CIPHER" | PAN_PASS="$PAN_SEC" python pan_crypt.py decrypt || true)
            if [ -z "$TOK" ]; then
              echo "WARN: could not decrypt prefetched token -- this shard will log in itself (fallback)" >&2
            else
              echo "::add-mask::$TOK"
              echo "PAN_CLIENT_TOKEN_PREFETCHED=$TOK" >> "$GITHUB_ENV"
            fi
          fi
        env:
          PAN_TOKEN_CIPHER: ${{ needs.prep.outputs.pan_token_cipher }}
          PAN_SEC: ${{ secrets.PAN_CLIENT_SECRET }}
      - name: restore ledger cache
        uses: actions/cache/restore@v4
        with:
          path: ledger.json
          key: warm-dlink-ledger-s${{ matrix.shard }}-${{ github.run_id }}
          restore-keys: |
            warm-dlink-ledger-s${{ matrix.shard }}-
      - name: warm shard
        run: python warm_dlink.py
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          D1_API_TOKEN: ${{ secrets.D1_API_TOKEN }}
          PAN_CLIENT_ID: ${{ secrets.PAN_CLIENT_ID }}
          PAN_CLIENT_SECRET: ${{ secrets.PAN_CLIENT_SECRET }}
          # PAN_CLIENT_TOKEN_PREFETCHED already set into $GITHUB_ENV by the decrypt step
          # above (or left unset -> warm_dlink.py falls back to logging in itself)
          SHARD: ${{ matrix.shard }}
          TOTAL: ${{ github.event.inputs.total || '3' }}
          PILOT: ${{ github.event.inputs.pilot }}
      - name: save ledger cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ledger.json
          key: warm-dlink-ledger-s${{ matrix.shard }}-${{ github.run_id }}
