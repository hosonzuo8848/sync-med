name: tests

# 只挂 push / pull_request,【没有 cron】。这是一道 CI 闸,不是产线任务 ——
# 它要在"判据被改坏的那一刻"红,不是每天定时跑一遍告诉你昨天就坏了。
on:
  push:
  pull_request:

# 同一分支连推几次时,取消掉过时的 run(本仓 workflow 通行规矩)。
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ocr-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 判据回归。ocr_quality.py 本身零第三方依赖,测试也只用标准库 unittest,
      # 这里装 pytest 只是为了跟本地验收命令 `python -m pytest tests/ -q` 完全一致 ——
      # CI 跑的和人手上跑的必须是同一条命令,不然两边会各自漂移。
      - name: install pytest
        # pyyaml：`scripts/check_metric.py`(指标受控注册表的机器闸)与
        #   `tests/test_metrics_registry.py` 要读 metrics_registry.yaml。
        #   不显式装的话，CI 上能不能 import yaml 取决于 runner 镜像里恰好有没有 ——
        #   那是"靠运气绿"，哪天镜像一变就整片 ERROR，且看起来像我们的代码坏了。
        run: pip install --quiet pytest pyyaml

      - name: OCR 质量闸判据回归(正货放行 + 垃圾判死)
        run: python -m pytest tests/ -q

      # 退路自检:没有 pytest 也必须跑得起来(测试用 unittest 写的就是为这个)。
      # 这一步防的是"哪天 pytest 装不上,CI 直接哑火"。
      - name: 零依赖退路(unittest)
        run: python -m unittest discover -s tests -q

      # 单一实现闸(2026-08-31):防"同一逻辑复制粘贴、漏改一处"复发 ——
      #   ask()/d1()/parse_json() 抄本漏带网关钥匙,是内容线断产22天的真因。
      #   冻结今日存量为基线,只拦"新增第二份"或"新硬编码端点"。基线只缩不增。
      - name: 单一实现闸 (single-source guard)
        run: python scripts/guard_single_source.py

      # Python 3.11 编译闸(2026-09-26):runner 和各条产线用的都是 3.11,本机常常是 3.12。
      #   3.12 放宽了 f-string 等语法,本机编得过、云端报 SyntaxError。#729 就是这样把整个 fleet-watch 打挂的。
      #   这里用和线上相同的 3.11 把 scripts/ 全部编译一遍,编不过就红。
      - name: Python 3.11 编译闸 (scripts/)
        run: python -m compileall -q scripts
