name: sync

on:
  # 2026-09-26: schedule paused to yield the 139 pan account to webp-convert (both log in as the same uid and
  #   revoke each other's token). Restore these two lines after the conversion batch finishes, then dispatch once.
  # schedule:
  #   - cron: "0 */3 * * *"          # 每3h自动跑·无人值守(幂等skip-done·补完后都是秒跳)
    # 2026-07-17: NAME_KEY自愈已验证真实生效(D1现场重建39488个书名成功),恢复cron。
  workflow_dispatch:
    inputs:
      total:
        description: shard count (concurrency)
        default: "3"
concurrency:
  group: sync-med
  cancel-in-progress: false

jobs:
  prep:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.g.outputs.shards }}
      pan_token: ${{ steps.panlogin.outputs.token }}
      pan_client_token: ${{ steps.panlogin2.outputs.token }}
    steps:
      - id: g
        run: python -c "import json,os;print('shards='+json.dumps(list(range(int(os.environ['T'])))))" >> "$GITHUB_OUTPUT"
        env:
          T: ${{ github.event.inputs.total || '256' }}
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet boto3 requests pillow
      # 2026-09-26: log in ONCE per credential pair here, hand the token to every run-job
      # shard via a masked job output. Fixes 256 shards (max-parallel 3) each calling
      # access_token and revoking each other's token -- 123 keeps only the newest login per
      # account (see webp-convert.yml's header for the same account being shared, and
      # scripts/webp_convert/run.py's mask()/Renewer for the masking convention this
      # follows). Two pairs: PAN_CID/PAN_SEC pushes zip/pdf (pan()/token() in sync.py),
      # PAN_CLIENT_ID/PAN_CLIENT_SECRET reads pages (pan_token() in sync.py).
      - name: pan login once (zip/pdf account)
        id: panlogin
        run: |
          set -euo pipefail
          TOKEN=$(python pan_login.py)
          if [ -z "$TOKEN" ]; then echo "empty token" >&2; exit 1; fi
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"
        env:
          PAN_BASE: ${{ secrets.PAN_BASE }}
          PAN_CID: ${{ secrets.PAN_CID }}
          PAN_SEC: ${{ secrets.PAN_SEC }}
      - name: pan login once (page-read account)
        id: panlogin2
        run: |
          set -euo pipefail
          TOKEN=$(python pan_login.py)
          if [ -z "$TOKEN" ]; then echo "empty token" >&2; exit 1; fi
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"
        env:
          PAN_BASE: ${{ secrets.PAN_BASE }}
          PAN_CID: ${{ secrets.PAN_CLIENT_ID }}
          PAN_SEC: ${{ secrets.PAN_CLIENT_SECRET }}
      - name: build already-done list (skip backed-up books, no dup errors)
        run: python sync.py prep
        env:
          S_EP: ${{ secrets.S_EP }}
          S_AK: ${{ secrets.S_AK }}
          S_SK: ${{ secrets.S_SK }}
          S_BUCKET: ${{ secrets.S_BUCKET }}
          S_PREFIX: ${{ secrets.S_PREFIX }}
          PAN_BASE: ${{ secrets.PAN_BASE }}
          PAN_CID: ${{ secrets.PAN_CID }}
          PAN_SEC: ${{ secrets.PAN_SEC }}
          PAN_DIR_A: ${{ secrets.PAN_DIR_A }}
          PAN_DIR_B: ${{ secrets.PAN_DIR_B }}
          PAN_TOKEN_PREFETCHED: ${{ steps.panlogin.outputs.token }}

  run:
    needs: prep
    runs-on: ubuntu-latest
    timeout-minutes: 120         # 硬闸:超 2 小时 GitHub 杀(防卡死·06-20 慢上传留足时间·幂等 skip-done 下次续)
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        shard: ${{ fromJSON(needs.prep.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet boto3 requests pillow
      # job outputs are NOT masked across jobs (each job is a fresh runner) -- re-apply the
      # mask here before this job's own logs can echo the token back in plain text.
      - name: mask prefetched pan tokens
        run: |
          echo "::add-mask::$PAN_TOKEN_PREFETCHED"
          echo "::add-mask::$PAN_CLIENT_TOKEN_PREFETCHED"
        env:
          PAN_TOKEN_PREFETCHED: ${{ needs.prep.outputs.pan_token }}
          PAN_CLIENT_TOKEN_PREFETCHED: ${{ needs.prep.outputs.pan_client_token }}
      - run: python sync.py
        env:
          S_EP: ${{ secrets.S_EP }}
          S_AK: ${{ secrets.S_AK }}
          S_SK: ${{ secrets.S_SK }}
          S_BUCKET: ${{ secrets.S_BUCKET }}
          S_PREFIX: ${{ secrets.S_PREFIX }}
          PAN_BASE: ${{ secrets.PAN_BASE }}
          PAN_CID: ${{ secrets.PAN_CID }}
          PAN_SEC: ${{ secrets.PAN_SEC }}
          PAN_DIR_A: ${{ secrets.PAN_DIR_A }}
          PAN_DIR_B: ${{ secrets.PAN_DIR_B }}
          NAME_KEY: ${{ secrets.NAME_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          D1_API_TOKEN: ${{ secrets.D1_API_TOKEN }}
          # 2026-07-22: 取图从123需要的open_platform凭据(与推zip/pdf的PAN_CID/PSEC不同对,secret仓库已有)
          PAN_CLIENT_ID: ${{ secrets.PAN_CLIENT_ID }}
          PAN_CLIENT_SECRET: ${{ secrets.PAN_CLIENT_SECRET }}
          # 2026-09-26: both logged in once by prep -- see pan_login.py. sync.py's token()/
          # pan_token() use these instead of calling access_token themselves.
          PAN_TOKEN_PREFETCHED: ${{ needs.prep.outputs.pan_token }}
          PAN_CLIENT_TOKEN_PREFETCHED: ${{ needs.prep.outputs.pan_client_token }}
          SHARD: ${{ matrix.shard }}
          TOTAL: ${{ github.event.inputs.total || '256' }}
