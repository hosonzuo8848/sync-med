name: laya-zh-eval

# Manual-only judge dry-run: install NandhaKishorM/laya pinned to one commit SHA
# (new/unverified repo, isolate: no secrets, read-only token, artifact-only output).
on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: laya-zh-eval
  cancel-in-progress: true

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Laya (pinned commit, Apache-2.0, no secrets)
        run: |
          python -m pip install --upgrade pip
          python -m pip install "git+https://github.com/NandhaKishorM/laya.git@010bacef009c855ccba814b51f7c8e1d38ab5e3f"

      - name: Run Laya zh eval (20 cases, CPU, local inference only)
        run: python scripts/laya_zh_eval.py | tee laya_zh_eval_stdout.log

      - uses: actions/upload-artifact@v4
        with:
          name: laya-zh-eval-result
          path: |
            laya_zh_eval_result.json
            laya_zh_eval_stdout.log
          retention-days: 14
