name: rights-ai-classify

# P1-18 (2026-09-10): 325 books_text rows are rights_status='unverified' and therefore hidden. Ask the internal
# free-pool gateway (never a paid lane, never a direct provider) whether each title is a pre-1912 classic or a
# modern work. READ-ONLY: D1 is only read; the run leaves an artifact + an Issue table for the CTO to review.
# Who sees it when it breaks: the Issue title carries failed/low counts; fleet-watch does not track this job.

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "max rows to classify"
        default: "400"

permissions:
  contents: read
  issues: write

concurrency:
  group: rights-ai-classify
  cancel-in-progress: false

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: classify
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          D1_API_TOKEN: ${{ secrets.D1_API_TOKEN }}
          GW_KEY: ${{ secrets.GW_KEY }}
          GH_TOKEN: ${{ github.token }}
          LIMIT: ${{ github.event.inputs.limit }}
        run: python scripts/rights/ai_classify.py
      - uses: actions/upload-artifact@v4
        with:
          name: rights_ai
          path: |
            rights_ai.json
            issue.md
