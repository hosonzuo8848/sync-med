name: forge-smoke

# 私有核心仓能不能在 Actions 里被 checkout —— 这一件卡住了 6 个模块的接线,
# 所以先用一个最小 workflow 把它验穿,再谈接哪个模块。
#
# 凭据用**只读 deploy key**(仓库级 SSH,只能读 sueai-forge 这一个仓),
# 不用跨账号 PAT:核心仓在另一个账号下,PAT 要么权限过大要么根本读不到。
# key 泄露的最坏后果是这一个私有仓被读,且随时可在仓库 Settings→Deploy keys 删掉。

on:
  workflow_dispatch:
  schedule:
    # 每天一次。模块自测是"私有仓代码还能不能跑"的哨兵 —— 只有手动触发的话,
    # 等真要接线时才发现跑不了,就晚了。
    - cron: "40 19 * * *"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: checkout 私有核心仓
        uses: actions/checkout@v4
        with:
          repository: hosonzuo/sueai-forge
          ssh-key: ${{ secrets.FORGE_DEPLOY_KEY }}
          path: forge

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 装依赖
        # 私有仓没有 requirements.txt(它是模块集合不是应用),依赖从源码里 grep 出来的:
        # lxml(自适应解析)/ requests(取页)/ pyyaml(配置)/ numpy(切块打分)/ cssselect(选择器)。
        # playwright、scrapling 是可选降级路径,不装 —— 模块本身对缺它们有降级分支。
        run: pip install -q lxml requests pyyaml numpy cssselect

      - name: 模块自测
        # 每条单独判,失败当场退出。**不许再用 `| tail -1`** ——
        # 管道会把被测命令的退出码换成 tail 的,首版就是这样:6 个自测全炸,run 照样绿。
        # 这跟 verify_all 里那条"一个永远说 PASS 的自检等于没有"是同一个道理,
        # 我在自己的 workflow 里又踩了一次。
        run: |
          set -eo pipefail
          cd forge
          echo "── 目录 ──"; ls -d *_core | tr '\n' ' '; echo
          echo "── 行数 ──"; find . -name '*.py' -o -name '*.mjs' -o -name '*.js' | xargs cat 2>/dev/null | wc -l
          fail=0
          run_one () {
            echo "── $1"
            if out=$(eval "$2" 2>&1); then
              echo "$out" | tail -1
            else
              echo "$out" | tail -5
              echo "   ✗ $1 失败"
              fail=1
            fi
          }
          run_one chunk_core      "python -X utf8 chunk_core/chunker.py"
          run_one crawl_core      "python -X utf8 crawl_core/extract.py"
          run_one skills_core     "python -m skills_core._selftest"
          run_one rag_core        "python -X utf8 rag_core/_selftest.py"
          run_one research_core   "python -X utf8 research_core/_selftest.py"
          run_one knowledge_core  "python -X utf8 knowledge_core/_selftest.py"
          run_one route_core      "cd route_core && node router.test.mjs"
          echo "──────────"
          [ "$fail" = 0 ] && echo "ALL PASS" || { echo "有模块自测未通过"; exit 1; }
