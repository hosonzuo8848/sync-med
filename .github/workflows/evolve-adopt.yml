# ============================================================
# 自进化闭环 · Adopt 环:GitHub 热门应用 → 进化我们的技术
#
# 立此因(2026-08-04 创始人):
#   「你先实现 GitHub 热门应用推送进化我们的技术,这个就已经是成功了第一步」
#
# 补的断点:`arsenal_radar` 每天扫 GitHub 高星仓,candidates.json 里躺着 60 个现成候选,
#   而它自己写着「不做采不采用的判断,判断在 SueAI 议事会」——**那个议事会从来没建**。
#   情报采回来了,没有任何东西把它变成动作。本 workflow 就是那个议事会。
#
# 判定必须落到**我们的真实模块**上(检索路由/RAG/星图/寻脉/导读/内容工厂/OCR/…),
#   说不出"改哪个模块、动哪个指标"的一律 skip —— 这条判据本身就是过滤器,
#   防止又产出一份"很有启发"但没人能动手的情报日报。
#
# **谁审核**(创始人直接问的):高分提案自动开 Issue,采纳由创始人/CTO 在 Issue 上点。
#   系统**只出提案,不改任何代码** —— 代码级改动永远走 PR + CI + 人 merge。
#
# 成本:GitHub 候选来自已有 candidates.json(零额外 API);判定走内部免费池网关,零计费。
# ============================================================

name: Evolve Adopt

on:
  schedule:
    - cron: '50 2 * * *'        # 每天一轮,错开雷达与内容工厂
  workflow_dispatch:
    inputs:
      limit:
        description: '本轮评审几个候选'
        required: false
        default: '30'
      dry_run:
        description: '只评审不写库'
        type: boolean
        required: false
        default: false

concurrency:
  group: evolve-adopt
  cancel-in-progress: false

jobs:
  adopt:
    runs-on: ubuntu-latest
    # 45 分钟:星网共判把每候选最坏调用放大到 8 次,30 分钟对不上最坏账(2026-08-08 审出);
    # adopt.py 侧另有 20 分钟软预算自截,双保险
    timeout-minutes: 45
    permissions:
      contents: write        # 要把收件箱提交回仓
      issues: write             # 高分提案要能被看见,不许只躺在表里
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 月榜全量入库(纯限定符查询,不靠关键词猜;零 AI 调用)
        env:
          CF_ACCOUNT_ID:  ${{ secrets.CF_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          D1_API_TOKEN:   ${{ secrets.D1_API_TOKEN }}
          GW_KEY:         ${{ secrets.GW_KEY }}
          GITHUB_TOKEN:   ${{ secrets.GITHUB_TOKEN }}
          PYTHONIOENCODING: utf-8
        run: python scripts/evolve/trending.py --days 30 --report evolve_trending.json

      # 【2026-08-09 接调度·根治 star_delta 全0】ranks.py 抓 OpenGithubs 飙升榜拿「月Star
      #   增长量」这个 GitHub Search API 拿不到的信号,写进 gh_repo_pool.star_delta。此前它
      #   建好从没接进任何 workflow → star_delta 全表 4603 个全0 → adopt 采集排序退化成纯
      #   stars、每轮撞同批超级头部教程/框架被预筛砍99%、616个垂直候选永远轮不到。纯采集+
      #   正则零AI调用、幂等(ON CONFLICT star_delta=MAX);失败不致命,下游垂直词排序兜底。
      - name: 星速回填(ranks·让高增长垂直项目排上来)
        env:
          CF_ACCOUNT_ID:  ${{ secrets.CF_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          D1_API_TOKEN:   ${{ secrets.D1_API_TOKEN }}
          GITHUB_TOKEN:   ${{ secrets.GITHUB_TOKEN }}
          PYTHONIOENCODING: utf-8
        run: |
          # --recent 3：日榜有 886 期(2024 起)，日常只吃最近 3 期即可；
          #   历史回填另跑一次 `--years 2026,2025,2024 --recent 0`，轨迹表幂等可续跑。
          # --report：把 by_kind 期次/条数落成 json，供下一步做哨兵判定。
          set +e
          python scripts/evolve/ranks.py --years 2026 --recent 3 --report evolve_ranks.json
          echo "ranks_exit=$?" >> "$GITHUB_ENV"
          set -e

      # 哨兵：ranks 的结果必须在人眼前出现一次。
      # 立此因(2026-08-27)：此前 list_files 静默吞 404 + 这一步 `|| echo 失败不致命`，
      #   两层叠加把「日榜/周榜恒为 0 期」藏了 23 天，期间星速信号全靠 8 期月榜撑着。
      - name: 榜单采集哨兵(零期次/零解析要出声)
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          try:
              d = json.load(open("evolve_ranks.json", encoding="utf-8"))
          except Exception as e:
              print(f"### 榜单采集\n\n> 没生成结果表({type(e).__name__})，本轮 ranks 整体失败，查上一步日志。")
              raise SystemExit(0)
          print("### 榜单采集")
          print()
          print("| 榜 | 期次 | 解析条数 |")
          print("|---|---|---|")
          for k, v in sorted(d.get("by_kind", {}).items()):
              print(f"| {k} | {v['periods']} | {v['items']} |")
          print()
          print(f"轨迹入库 `gh_growth` **{d.get('growth_saved', 0)}** 条 · 池内唯一仓 {d.get('pool_total', '?')}")
          empty = d.get("empty_kinds") or []
          if empty:
              print()
              print(f"> **WARNING 这些榜零解析：{', '.join(empty)}** —— 上游目录结构或版式可能又变了。")
              print("> 判据：正常状态下三个榜都该有条数。零解析不是正常状态。")
          if d.get("write_failed") or d.get("growth_failed"):
              print()
              print("> **WARNING write unread** - a rank write failed, so a saved count of 0 is not an empty board.")
          if d.get("list_failed"):
              print("> **WARNING list unread** - a rank directory could not be listed, so zero periods is not an empty board.")
          if d.get("fetch_failed"):
              print("> **WARNING period unread** - a rank file could not be downloaded, so zero items is not a format change.")
          if d.get("pool_total") == "unread":
              print("> **WARNING pool unread** - the pool count was not read.")
          PY

      - name: 缺口驱动采集(从我们的短板出发定向抓,不捡热门)
        env:
          CF_ACCOUNT_ID:  ${{ secrets.CF_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          D1_API_TOKEN:   ${{ secrets.D1_API_TOKEN }}
          GW_KEY:         ${{ secrets.GW_KEY }}
          GITHUB_TOKEN:   ${{ secrets.GITHUB_TOKEN }}
          PYTHONIOENCODING: utf-8
        run: python scripts/evolve/harvest.py --report evolve_harvest.json || echo '采集失败不致命,下一步用热门榜兜底'

      - name: 评审 GitHub 候选 → 落到我们的模块
        env:
          CF_ACCOUNT_ID:  ${{ secrets.CF_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          D1_API_TOKEN:   ${{ secrets.D1_API_TOKEN }}
          GW_KEY:         ${{ secrets.GW_KEY }}
          PYTHONIOENCODING: utf-8
        run: |
          python scripts/evolve/adopt.py \
            --limit "${{ github.event.inputs.limit || '30' }}" \
            --report evolve_adopt.json \
            ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}

      # 闭环的中间环是**本地审核人**(创始人 2026-08-05 定架构:没有服务器,绕本地的你审核)。
      # 所以产出必须落成仓里一个固定文件,审核人 git pull 就看见 —— 不能只开 Issue。
      - name: 生成审核收件箱并提交
        env:
          CF_ACCOUNT_ID:  ${{ secrets.CF_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          D1_API_TOKEN:   ${{ secrets.D1_API_TOKEN }}
          GW_KEY:         ${{ secrets.GW_KEY }}
          PYTHONIOENCODING: utf-8
        run: |
          python scripts/evolve/inbox.py
          git config user.name  'evolve-bot'
          git config user.email 'evolve-bot@users.noreply.github.com'
          git add reports/evolve/待审核.md
          git diff --cached --quiet || git commit -m "收件箱刷新 $(date -u +%Y-%m-%d) [skip ci]"
          git push || echo '推送失败(不致命,下轮重来)'

      # 关键动作必须能被看见 —— pan-register 连喊 12 天零人响应的教训
      - name: 高分提案开 Issue(采纳入口)
        if: ${{ success() && github.event.inputs.dry_run != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY' > issue_body.md
          import json, os
          d = json.load(open("evolve_adopt.json", encoding="utf-8"))
          ad, wa = d.get("adopt") or [], d.get("watch") or []
          if not ad and not wa:
              open("skip.flag", "w").write("1")
          print("> GitHub 热门项目已按**我们的真实模块**评审完毕。")
          print("> 系统只出提案,**不改任何代码**;要采纳请在本 Issue 回复,")
          print("> 代码级改动一律走 PR + CI + 人 merge。\n")
          if ad:
              print("## 🎯 建议采纳\n")
              print("| 项目 | 星 | 接到哪个模块 | 预计改善 | 怎么接 | 工作量 |")
              print("|---|---|---|---|---|---|")
              for r in ad:
                  print(f"| [{r['repo']}]({r.get('url')}) | {r.get('stars')} | **{r.get('module')}** "
                        f"| {r.get('metric')} | {r.get('how')} | {r.get('effort')} |")
          if wa:
              print("\n## 👀 方向对但现在不动\n")
              for r in wa:
                  print(f"- **{r['repo']}**({r.get('stars')}★)→ {r.get('module')}:{r.get('why')}")
          print(f"\n---\n本轮:采纳 {len(ad)} · 观望 {len(wa)} · 不相关 {d.get('skip',0)} · 失败 {d.get('fail',0)}")
          PY
          if [ -f skip.flag ]; then
            echo "本轮无可采纳提案,不开 Issue(避免变成噪声)"
          else
            gh issue create -R "$GITHUB_REPOSITORY" \
              --title "🎯 技术进化提案 · $(date -u +%Y-%m-%d)" \
              --body-file issue_body.md || echo "开 Issue 失败(不致命)"
          fi

      - name: 写进 Job Summary
        if: always()
        run: |
          echo "## GitHub 热门 → 技术进化提案" >> "$GITHUB_STEP_SUMMARY"
          [ -f evolve_adopt.json ] && cat issue_body.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || \
            echo "> ⚠️ 本轮没有产出,需要人看。" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evolve-adopt-${{ github.run_id }}
          path: evolve_adopt.json
          if-no-files-found: warn
