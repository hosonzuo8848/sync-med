name: 百家论道内容工厂

# 多 AI 学派分身圆桌研讨 → 研讨帖 → community_posts。免费池算力,零成本。
# 上云 12h 不停:去掉下面 schedule 的注释即可(需先在仓库 Secrets 配 CF_D1_TOKEN,
#   scoped token,权限仅 D1:Edit 对应 guyaofang-db,绝不用 Global API Key)。
on:
  workflow_dispatch:
    inputs:
      count:
        description: '本次产帖数'
        required: false
        default: '1'
  schedule:
    - cron: '25 */2 * * *'    # 每 12 分钟 1 篇(温和,避 sync-med 队列堆积);本地循环是主力,Actions 作云端持久备份

concurrency:
  group: roundtable-factory
  cancel-in-progress: false

# 2026-08-28 补 permissions：下面「失败上报 Issue(哨兵)」那一步用的是
# GITHUB_TOKEN 的默认权限，而本仓默认是只读 —— 实证见姊妹 workflow
# watch-roundtable.yml 的 run 33114029499：
#   POST /repos/gufangAI/sync-med/issues → 403 Resource not accessible by integration
# 这一步只在 `if: failure()` 时跑，所以症状是**只在真出事那次才炸**：
# 平时全绿看不出来，真失败那次告警发不出去，还把 run 又拖红一层。
# 对照本仓 12 个能正常写 Issue 的 workflow，它们都显式声明了 issues: write。
permissions:
  contents: read
  issues: write

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 产研讨帖(免费池)
        run: python tools/roundtable/roundtable.py --count ${{ github.event.inputs.count || 1 }}
        env:
          CF_D1_TOKEN: ${{ secrets.D1_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}   # 2026-09-15: opsec commit 5eb1f75 moved the account id to env but never passed it here -> D1 URL 404, 0 posts since 08-30
          GW_KEY: ${{ secrets.GW_KEY }}
      - name: 失败上报 Issue(哨兵)
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            // 2026-08-31 upsert-guard: 有开着的同类告警就追评论,不再每轮新建一个 Issue。
            // 侦察实测:持续停滞时旧写法最多每天 12 个新 Issue 刷屏。
            const _open = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'alert', per_page: 20 });
            const _hit = _open.data.find(i => (i.labels||[]).some(l => (l.name||l) === 'roundtable-fail'));
            if (_hit) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: _hit.number,
                body: `${new Date().toISOString()} 仍停滞(近3h新增 ${{ steps.check.outputs.recent }} 篇)` });
            } else
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `⚠️ 百家论道内容工厂失败 · run#${context.runNumber}`,
              body: `内容工厂 workflow 失败。\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\n排查:①CF_D1_TOKEN 是否配置/过期 ②/api/gateway/chat 是否可达 ③grounding_raw.json 是否在仓。`,
              labels: ['content-factory', 'alert']
            });
