# ============================================================
# Search term table (search_terms) for the retrieve API.
#
# 2026-09-26: the v1 trigram FTS half (books_fts / books_fts_state) is retired.
#   Retrieval reads books_fts_v2 since 2026-08-16; v1 had no reader left and wrote
#   0 rows per run. build_fts.py no longer creates or writes the v1 tables, so a
#   DROP of them will not be undone by this job.
#
# Cost: D1 reads/writes only, zero AI calls, zero R2.
# Writes: search_terms only (INSERT OR IGNORE, a rerun adds new rows only).
# Who sees a failure: this job goes red; the verify step exits 1 when
#   search_terms is unreadable or empty.
# ============================================================

name: Search Index

on:
  schedule:
    # 新书入库后补索引,一天一次够;错开其他产线的整点
    - cron: '15 19 * * *'          # UTC 19:15 = 新加坡 03:15
  workflow_dispatch:

concurrency:
  group: search-index
  cancel-in-progress: false        # 灌库中途被砍会留下半截,让它跑完

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 20            # terms phase measured 40-60s per run (2026-09-23/24)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 依赖:只用标准库(urllib + json),不 pip 装任何东西

      - name: 灌索引
        env:
          CF_ACCOUNT_ID:  ${{ secrets.CF_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          D1_API_TOKEN:   ${{ secrets.D1_API_TOKEN }}
          PYTHONIOENCODING: utf-8
        run: python scripts/search/build_fts.py

      - name: Verify (red if search_terms unreadable or empty)
        if: always()
        env:
          CF_ACCOUNT_ID:  ${{ secrets.CF_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          D1_API_TOKEN:   ${{ secrets.D1_API_TOKEN }}
          PYTHONIOENCODING: utf-8
        run: python scripts/search/build_fts.py --verify
